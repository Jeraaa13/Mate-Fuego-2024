<!-- maitre-home.component.html -->
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Lista de Espera</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <div class="users-grid">
        <div *ngFor="let usuario of listaDeEspera" class="user-card">
          <div class="user-photo-container">
            <img [src]="usuario.fotourl || 'assets/usudefault.png'" 
                 [alt]="usuario.nombre" 
                 class="user-photo"
                 (error)="handleImageError($event)">
          </div>
          <p class="nombre-usuario">{{ usuario.nombre }}</p>
          <div class="user-status" [class.assigned]="usuario.mesaAsignada">
            {{ usuario.mesaAsignada ? 'Mesa Asignada' : 'En Espera' }}
          </div>
          <ion-button 
            (click)="mostrarSeleccionMesas(usuario)"
            [disabled]="usuario.mesaAsignada"
            class="asignar-button"
            color="primary"
            size="small">
            Seleccionar Mesa
          </ion-button>
        </div>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Modal de selección de mesas -->
  <ion-modal [isOpen]="mostrarMesas" (didDismiss)="cerrarSeleccionMesas()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Seleccionar Mesa</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarSeleccionMesas()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-grid>
          <ion-row>
            <ion-col size="6" *ngFor="let mesa of mesasDisponibles">
              <ion-card>
                <ion-card-header>
                  <ion-card-subtitle>Mesa {{ mesa.numero }}</ion-card-subtitle>
                  <ion-card-title>{{ mesa.tipo }}</ion-card-title>
                </ion-card-header>
                <ion-card-content>
                  <p>Capacidad: {{ mesa.cantidadComensales }} personas</p>
                  <ion-button 
                    expand="block"
                    (click)="asignarMesaEspecifica(usuarioSeleccionado!, mesa)"
                    color="success">
                    Asignar Mesa
                  </ion-button>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
