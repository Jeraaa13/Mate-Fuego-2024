<div class="registro-container">
  <h2>Registro de Dueño / Supervisor</h2>

  <label for="nombre">Nombre</label>
  <input
    id="nombre"
    type="text"
    [(ngModel)]="nuevoDuenoSupervisor.nombre"
    placeholder="Nombre"
  />

  <label for="apellido">Apellido</label>
  <input
    id="apellido"
    type="text"
    [(ngModel)]="nuevoDuenoSupervisor.apellido"
    placeholder="Apellido"
  />

  <label for="dni">DNI</label>
  <input
    id="dni"
    type="text"
    [(ngModel)]="nuevoDuenoSupervisor.dni"
    placeholder="DNI"
  />

  <label for="cuil">CUIL</label>
  <input
    id="cuil"
    type="text"
    [(ngModel)]="nuevoDuenoSupervisor.cuil"
    placeholder="CUIL"
  />

  <label for="perfil">Perfil</label>
  <select id="perfil" [(ngModel)]="nuevoDuenoSupervisor.tipoPerfil">
    <option value="dueno">Dueño</option>
    <option value="supervisor">Supervisor</option>
  </select>

  <label for="email">Correo Electrónico</label>
  <input
    id="email"
    type="email"
    [(ngModel)]="nuevoDuenoSupervisor.email"
    placeholder="Correo Electrónico"
  />

  <label for="password">Contraseña</label>
  <input
    id="password"
    type="password"
    [(ngModel)]="nuevoDuenoSupervisor.password"
    placeholder="Contraseña"
  />

  <button (click)="takePhoto()">Tomar Foto</button>

  <div *ngIf="nuevoDuenoSupervisor.fotoUrl">
    <h3>Foto Capturada:</h3>
    <img
      [src]="nuevoDuenoSupervisor.fotoUrl"
      alt="Foto del usuario"
      class="foto-preview"
    />
  </div>

  <ion-button
    expand="block"
    color="primary"
    (click)="startScan()"
    style="--background: #e86c1c"
  >
    <ion-icon slot="start" name="qr-code-outline"></ion-icon>
    ESCANEAR DNI
  </ion-button>
  <div class="scanner-container" *ngIf="isScanning">
    <div class="scanner-overlay">
      <div class="scanner-frame"></div>
      <p class="scanner-instructions">
        Centra el código QR del DNI en el marco
      </p>
      <button class="cancel-button" (click)="stopScan()">
        Cancelar Escaneo
      </button>
    </div>
  </div>
  <button (click)="guardarDuenoSupervisor()">Guardar Dueño / Supervisor</button>
</div>
