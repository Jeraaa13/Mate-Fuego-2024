<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Order Management</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list>
              <ion-item *ngFor="let order of orders">
                <ion-grid>
                  <ion-row>
                    <ion-col size="3">{{ order.orderId }}</ion-col>
                    <ion-col size="3">{{ order.EstadoDePedido }}</ion-col>
                    <ion-col size="3">{{ order.TiempoEspera }} minutes</ion-col>
                    <ion-col size="3">$ {{ order.Precio }}</ion-col>
                  </ion-row>
                  <ion-row>
                    <ion-col size="3">{{ order.Mesa }}</ion-col>
                    <ion-col size="9">
                      <ion-button *ngIf="order.EstadoDePedido === 'solicitado'" (click)="acceptOrder(order)" fill="solid" color="success">Accept</ion-button>
                      <ion-button *ngIf="order.EstadoDePedido === 'solicitado'" (click)="rejectOrder(order)" fill="solid" color="danger">Reject</ion-button>
                    </ion-col>
                  </ion-row>
                </ion-grid>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
